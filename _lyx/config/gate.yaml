tiers:
  tier0:
    about: "fast tests, Slow category excluded"
    command: "dotnet test LyxCsharp.sln --filter \"Category!=Slow\" {args}"
    counter: vstest
    timeout_min: 10
  tier1:
    about: "slow tests"
    command: "dotnet test LyxCsharp.sln --filter Category=Slow {args}"
    counter: vstest
    timeout_min: 30
gates:
  webster: {tiers: [0, 1], scope: all}
  parent-align: {tiers: [0, 1], scope: all}
  finalize: {tiers: [0, 1], scope: all}
  darn-write: {tiers: [0, 1], scope: diff}
  code-burler-fix: {tiers: [0, 1], scope: diff}

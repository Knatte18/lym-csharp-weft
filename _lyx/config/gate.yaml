tiers:
    tier0:
        about: "fast tests, Slow category excluded"
        command: "dotnet test LyxCsharp.sln --filter \"Category!=Slow\" {args}"
        counter: vstest
        timeout_min: 10
    tier1:
        about: "slow tests"
        command: "dotnet test LyxCsharp.sln --filter Category=Slow {args}"
        counter: vstest
        timeout_min: 30
gates:
    final: [0, 1]
    landing: [0, 1]
